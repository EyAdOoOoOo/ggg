<!doctype html>
<html lang="en" dir="ltr" class="js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f4" />
    <meta name="description" content="Snapshots and sweet moments made for Joudy, with love from Eyad." />
    <title>Joudy & Eyad — a cute moment with you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>document.documentElement.classList.add('js');</script>
    <script src="content.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip"></a>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Joudy and Eyad, home"><span class="brand-heart" aria-hidden="true">♥</span><span>J <i>&</i> E</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#gallery" data-i18n="navMoments"></a>
        <a href="#reasons" data-i18n="navReasons"></a>
        <a href="#valentine" data-i18n="navQuestion"></a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="hero-wash" aria-hidden="true"></div>
        <div class="floating-hearts" id="floating-hearts" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 id="hero-title"><span data-i18n="heroPrefix"></span> <span class="script-name" data-i18n="herName"></span><span class="title-period">.</span></h1>
          <p class="hero-subtitle" data-i18n="heroSubtitle"></p>
          <a class="button button-primary hero-cta" href="#gallery"><span data-i18n="heroCta"></span><span aria-hidden="true">↓</span></a>
          <p class="hero-signature"><span data-i18n="from"></span> <span data-i18n="myName"></span> <span aria-hidden="true">♡</span></p>
        </div>
        <div class="hero-stamp" aria-hidden="true"><span>YOU<br />+ ME</span><b>♥</b><span data-i18n="forever"></span></div>
        <a class="scroll-cue" href="#gallery" aria-label="Scroll to our snapshots"><span></span></a>
      </section>

      <section class="section gallery-section" id="gallery" aria-labelledby="story-title">
        <div class="section-heading reveal">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="storyKicker"></span><span class="eyebrow-line"></span></p>
          <h2 id="story-title" data-i18n="storyTitle"></h2>
          <p class="section-intro" data-i18n="storyIntro"></p>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
        <p class="gallery-hint"><span aria-hidden="true">↗</span> <span data-i18n="galleryHint"></span></p>
      </section>

      <section class="section reasons-section" id="reasons" aria-labelledby="reasons-title">
        <div class="section-heading reveal">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="reasonsKicker"></span><span class="eyebrow-line"></span></p>
          <h2 id="reasons-title" data-i18n="reasonsTitle"></h2>
          <p class="section-intro" data-i18n="reasonsIntro"></p>
        </div>
        <div class="reasons-grid" id="reasons-grid"></div>
        <p class="tiny-note"><span aria-hidden="true">✿</span> <span data-i18n="reasonsFootnote"></span></p>
      </section>

      <section class="letter-section" id="letter" aria-labelledby="letter-title">
        <div class="letter-decoration letter-decoration-left" aria-hidden="true">✿</div>
        <div class="letter-decoration letter-decoration-right" aria-hidden="true">♡</div>
        <div class="letter-card reveal">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="letterKicker"></span><span class="eyebrow-line"></span></p>
          <h2 id="letter-title" data-i18n="letterTitle"></h2>
          <div class="letter-copy" id="letter-copy" aria-live="polite"></div>
          <button class="text-button" id="replay-letter" type="button"><span aria-hidden="true">↻</span> <span data-i18n="replay"></span></button>
        </div>
      </section>

      <section class="valentine-section" id="valentine" aria-labelledby="valentine-title">
        <div class="valentine-sparkle" aria-hidden="true">✦</div>
        <div class="valentine-inner reveal">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="questionKicker"></span><span class="eyebrow-line"></span></p>
          <div class="big-heart" aria-hidden="true">♥</div>
          <h2 id="valentine-title" data-i18n="questionTitle"></h2>
          <p class="valentine-subtitle" data-i18n="questionSubtitle"></p>
          <div class="valentine-actions" id="valentine-actions">
            <button class="button button-primary yes-button" id="yes-button" type="button"><span data-i18n="yes"></span><span aria-hidden="true">♥</span></button>
            <button class="button button-quiet no-button" id="no-button" type="button"><span data-i18n="no"></span></button>
          </div>
          <p class="yes-message" id="yes-message" role="status" aria-live="polite"></p>
          <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="back-to-top" href="#home" aria-label="Back to top">↑</a>
        <p class="footer-love"><span data-i18n="madeWith"></span> <span aria-label="love">♥</span> <span data-i18n="by"></span> <strong data-i18n="myName"></strong></p>
        <p class="together-count"><span data-i18n="togetherPrefix"></span> <strong id="days-together">—</strong> <span data-i18n="togetherSuffix"></span></p>
      </div>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="Photo preview">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close photo">×</button>
      <div class="lightbox-content" id="lightbox-content"></div>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </dialog>
  </body>
</html>
